<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>platformer-1-1</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      /* Integer CSS scaling plus nearest-neighbour: the 256x240 framebuffer must not be resampled. */
      canvas {
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="256" height="240"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
